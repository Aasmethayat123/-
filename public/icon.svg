<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />

  <!-- Subtle inner radial glow circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />

  <!-- Life Leaf Icon -->
  <g filter="url(#softGlow)" transform="translate(106, 106)">
    <!-- Main leaf body -->
    <path d="M150 10 C 230 10, 290 70, 290 150 C 290 230, 230 290, 150 290 C 70 290, 10 230, 10 150 C 10 70, 70 10, 150 10 Z" fill="none" />
    
    <!-- Organic curved leaf 1 -->
    <path d="M50 220 C 50 120, 150 40, 240 50 C 250 140, 170 240, 70 240 C 60 240, 50 230, 50 220 Z" fill="url(#leafGrad)" />
    
    <!-- Inner leaf highlights & stem -->
    <path d="M70 230 C 110 170, 170 110, 230 65" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M130 145 C 160 130, 185 130, 205 120" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" />
    <path d="M100 185 C 125 175, 145 175, 165 165" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Second delicate sprout leaf -->
    <path d="M110 250 C 160 250, 210 200, 215 150 C 170 150, 120 190, 110 250 Z" fill="url(#accentGrad)" opacity="0.85" />
  </g>

  <!-- Brand Typography accent at bottom -->
  <text x="256" y="440" font-family="sans-serif" font-size="34" font-weight="900" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">نسمة حياة</text>
</svg>
